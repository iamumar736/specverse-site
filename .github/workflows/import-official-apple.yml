name: Import verified Apple iPhone technical specs
on:
  workflow_dispatch:
  push:
    branches: [main, feature/official-iphone-specs-55-models]
    paths:
      - 'scripts/import-official-apple.mjs'
      - '.github/workflows/import-official-apple.yml'
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install source parser
        run: npm install --no-save --no-audit --no-fund cheerio
      - name: Fetch official iPhone technical specifications
        run: node scripts/import-official-apple.mjs
      - name: Commit verified iPhone data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/official-apple.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified Apple specifications"
            for attempt in 1 2 3 4; do
              git fetch origin "$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME"
              if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
              sleep $((attempt*3))
            done
            exit 1
          fi
