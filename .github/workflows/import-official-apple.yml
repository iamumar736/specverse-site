name: Import verified Apple iPhone technical specs
on:
  schedule:
    - cron: '20 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: specverse-data-publication
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install source parser
        run: npm install --no-save --no-audit --no-fund cheerio
      - name: Import manufacturer specs and discover newly listed iPhones
        run: node scripts/import-official-apple.mjs
      - name: Validate accepted model identities and provenance
        run: node scripts/validate-catalog.mjs
      - name: Publish source-verified iPhone updates
        run: bash scripts/publish-data.sh 'Refresh Apple iPhone specifications and models' public/data/official-apple.json public/data/discovered.json
