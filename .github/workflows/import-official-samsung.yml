name: Import official Samsung model specifications
on:
  workflow_dispatch:
  push:
    branches: [main, feature/official-samsung-specs]
    paths:
      - 'scripts/import-official-samsung.mjs'
      - '.github/workflows/import-official-samsung.yml'
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund cheerio
      - name: Fetch official Samsung product specification tables
        run: node scripts/import-official-samsung.mjs
      - name: Publish source-verified Samsung models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/official-samsung.json public/data/samsung-verification-coverage.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish source-verified regional Samsung specifications"
            for attempt in 1 2 3 4; do
              git fetch origin "$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME"
              if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
              sleep $((attempt*3))
            done
            exit 1
          fi
