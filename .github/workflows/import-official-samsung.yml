name: Import official Samsung model specifications
on:
  schedule:
    - cron: '40 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: specverse-data-publication
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official spec page parser
        run: npm install --no-save --no-audit --no-fund cheerio
      - name: Verify missing models against Samsung regional spec pages
        run: node scripts/import-official-samsung.mjs --max=24 --regions=3
      - name: Publish verified records and next lookup cursor
        run: bash scripts/publish-data.sh 'Refresh Samsung regional spec coverage' public/data/official-samsung.json public/data/samsung-verification-coverage.json public/data/samsung-import-state.json
