name: Report automatic catalog failures
on:
  workflow_run:
    workflows:
      - SpecVerse daily catalog update
      - Import verified Apple iPhone technical specs
      - Import official Samsung model specifications
      - Import official OPPO and vivo specifications
      - Verify and animate real phone images
    types: [completed]
permissions:
  contents: read
  issues: write
jobs:
  report-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create or update the open catalog automation issue
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = 'SpecVerse automated catalog updater needs attention';
            const body = [
              'One or more unattended phone-data jobs failed. Previously verified information remains preserved.',
              '',
              '**Failed workflow:** ' + run.name,
              '**Run:** ' + run.html_url,
              '**Branch:** ' + run.head_branch,
              '**Completed:** ' + (run.updated_at || 'see linked run'),
              '',
              'Inspect the linked GitHub Actions logs. The next scheduled run will retry automatically.'
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo,{
              owner,repo,state:'open',per_page:100
            });
            const existing = issues.find(issue=>issue.title===title&&!issue.pull_request);
            if(existing){
              await github.rest.issues.createComment({
                owner,repo,issue_number:existing.number,body
              });
            } else {
              await github.rest.issues.create({owner,repo,title,body});
            }
