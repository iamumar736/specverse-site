name: Verify and animate real phone images
on:
  schedule:
    - cron: '40 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: specverse-data-publication
  cancel-in-progress: false
jobs:
  verify-device-images:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test matching, safety and display logic
        run: npm test
      - name: Check public licenses and exact device image identities online
        run: node scripts/update-animated-device-visuals.mjs --max=12
      - name: Save licensed images, attribution and verification manifest
        run: |
          git config user.name 'specverse-device-visuals[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- public/data/animated-device-images.json public/device-image-credits.html
          git add -A -- public/device-visuals/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No visual updates to publish'
            exit 0
          fi
          git commit -m 'Refresh licensed, model-matched animated device visuals'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo 'Device visuals and credits published'
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo 'Could not publish after rebasing retries'
          exit 1
