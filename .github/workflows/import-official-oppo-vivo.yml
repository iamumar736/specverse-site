name: Import official OPPO and vivo specifications
on:
  schedule:
    - cron: '15 6 * * 2,5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: specverse-data-publication
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install model source parser
        run: npm install --no-save --no-audit --no-fund cheerio
      - name: Scan official product pages incrementally
        run: node scripts/import-official-oppo-vivo.mjs --max=120
      - name: Publish verified regional model specs
        run: bash scripts/publish-data.sh 'Refresh verified OPPO and vivo regional specs' public/data/official-oppo.json public/data/official-vivo.json public/data/oppo-vivo-verification-coverage.json public/data/oppo-vivo-import-state.json
