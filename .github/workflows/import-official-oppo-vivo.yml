name: Import official OPPO and vivo specifications
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --no-audit --no-fund cheerio
      - name: Verify manufacturer model specifications
        run: node scripts/import-official-oppo-vivo.mjs
      - name: Publish verified model records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/official-oppo.json public/data/official-vivo.json public/data/oppo-vivo-verification-coverage.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish official OPPO and vivo technical specifications"
            for attempt in 1 2 3; do
              git fetch origin "$GITHUB_REF_NAME"
              if git rebase "origin/$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
              git rebase --abort || true
              sleep $((attempt*3))
            done
            exit 1
          fi
