name: Probe vivo historical spec labels
on:
  push:
    branches: [feature/official-oppo-vivo-specs]
    paths: ['scripts/probe-vivo-labels.mjs','.github/workflows/probe-vivo-labels.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --no-audit --no-fund cheerio
      - run: node scripts/probe-vivo-labels.mjs
