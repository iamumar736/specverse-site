name: SpecVerse daily catalog update
on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: specverse-data-publication
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import new public Android model identities
        run: node scripts/import-open-devices.mjs || echo "::warning::Open phone source unavailable: preserving old catalog"
      - name: Discover newly registered models from Wikidata
        run: node scripts/import-wikidata.mjs || echo "::warning::Wikidata unavailable: preserving previous discoveries"
      - name: Enrich discovered models (best effort)
        run: node scripts/enrich-wikidata.mjs || echo "::warning::Wikidata enrichment unavailable"
      - name: Refresh and merge source-checked catalog
        env:
          SPECVERSE_FEED_URL: ${{ secrets.SPECVERSE_FEED_URL }}
          SPECVERSE_FEED_URLS: ${{ secrets.SPECVERSE_FEED_URLS }}
          SPECVERSE_FEED_TOKEN: ${{ secrets.SPECVERSE_FEED_TOKEN }}
        run: node scripts/update-data.mjs
      - name: Validate catalog and record missing specifications
        run: node scripts/validate-catalog.mjs
      - name: Generate public automation status and coverage report
        run: node scripts/report-catalog-health.mjs
      - name: Run regression tests
        run: npm test
      - name: Publish verified data with concurrency safety
        run: bash scripts/publish-data.sh 'Refresh automated SpecVerse phone catalog' public/data/
