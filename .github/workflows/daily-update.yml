name: SpecVerse daily catalog update
on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover public phone entries (best effort)
        run: node scripts/import-wikidata.mjs || echo "Public discovery unavailable; keeping last catalog"
      - name: Refresh verified data
        env:
          SPECVERSE_FEED_URL: ${{ secrets.SPECVERSE_FEED_URL }}
          SPECVERSE_FEED_URLS: ${{ secrets.SPECVERSE_FEED_URLS }}
          SPECVERSE_FEED_TOKEN: ${{ secrets.SPECVERSE_FEED_TOKEN }}
        run: node scripts/update-data.mjs
      - name: Commit updated data
        run: |
          git config user.name 'specverse-updater'
          git config user.email 'specverse-updater@users.noreply.github.com'
          git add public/data/
          git diff --cached --quiet || (git commit -m 'Refresh SpecVerse catalog and prices' && git push)
